<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101216"><title>عرض H.M PST</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 20% 10%,#454b56,transparent 35%),linear-gradient(145deg,#08090b,#202329);font-family:Tahoma,Arial,sans-serif;color:#f3f4f6}.offer{width:min(520px,100%);padding:34px 25px;text-align:center;border:1px solid #ffffff35;border-radius:28px;background:linear-gradient(145deg,#292c33dd,#121418ed);box-shadow:0 25px 70px #0009}.badge{font-size:42px}.offer h1{font-size:27px;margin:12px 0;color:#fff}.offer p{line-height:2;color:#c8cdd5}.code{direction:ltr;display:block;margin:22px auto 12px;padding:17px;border:1px dashed #c6ccd6;border-radius:15px;background:#ffffff0b;font-size:30px;letter-spacing:7px;font-weight:900;min-height:66px}.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:bold;cursor:pointer;background:linear-gradient(145deg,#f4f5f7,#9ca2ac);color:#101115}.muted{font-size:12px;color:#9da5b2;margin-top:18px}.back{display:inline-block;margin-top:18px;color:#dce2eb}
</style></head><body><main class="offer"><div class="badge">🎉</div><h1>مبروك! كسبت عرض الـ200 جنيه</h1><p>أي أوردر هتطلبه، سعر القطعة الواحدة هيكون <b>200 جنيه</b> باستخدام البرومو كود الخاص بيك.</p><p>انسخ الكود واستخدمه في سلة المتجر قبل إرسال طلبك.</p><strong id="code" class="code">جاري إصدار الكود...</strong><button id="copy" class="btn" disabled>نسخ الكود</button><div id="status" class="muted">بنجهز كودك...</div><a class="back" href="index.html">الذهاب إلى المتجر ←</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://vknwuafwblmpezxbcydd.supabase.co','sb_publishable_jrTAyW1RzTKHzIBzi7bxYw_gPQcwUgO');
const statusBox=document.getElementById('status'),codeBox=document.getElementById('code'),copy=document.getElementById('copy');
(async()=>{try{let visitor=localStorage.getItem('hm-pst-promo-visitor');if(!visitor){visitor=crypto.randomUUID();localStorage.setItem('hm-pst-promo-visitor',visitor)}const {data,error}=await sb.rpc('issue_hm_promo_code',{p_visitor:visitor});if(error)throw error;codeBox.textContent=data;copy.disabled=false;statusBox.textContent='الكود خاص بهذا المتصفح. احتفظ به ولا تشاركه.'}catch(e){codeBox.textContent='—';statusBox.textContent='تعذر إصدار الكود: '+(e.message||'حاول مرة أخرى لاحقاً')}})();
copy.onclick=async()=>{try{await navigator.clipboard.writeText(codeBox.textContent);statusBox.textContent='تم نسخ الكود ✓'}catch(e){statusBox.textContent='حدد الكود وانسخه يدوياً.'}};
</script></body></html>
